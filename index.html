<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Time Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>School Time Table</h1>

    <table id="timetable">
      <thead>
        <tr>
          <th>Day / Time</th>
          <th>9:00 - 9:45</th>
          <th>9:45 - 10:30</th>
          <th>10:30 - 10:45</th>
          <th>10:45 - 11:30</th>
          <th>11:30 - 12:15</th>
          <th>12:15 - 1:00</th>
          <th>1:00 - 1:45</th>
          <th>1:45 - 2:30</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows inserted by JavaScript -->
      </tbody>
    </table>

    </div>

  <script src="script.js"></script>
</body>
</html>
